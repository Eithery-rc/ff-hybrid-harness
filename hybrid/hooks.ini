; hooks.ini - which exe functions the hybrid loader (dinput8.dll) points at their verified ports.
; Lives next to Freedom.Exe. Every key can be overridden by an environment variable FF_HYBRID_<KEY>
; (for example FF_HYBRID_MODE=none), and FF_HYBRID_INI=path selects another ini file.
;
; Addresses are hex (0x prefix optional), separated by commas, spaces or new lines.
; A range a-b covers a <= addr <= b. In list files, '#' or ';' starts a comment.

[hybrid]
; all  = every function the plan marks safe
; none = map nothing, run the original exe (sanity baseline)
; list = only the functions selected by include / include_file
mode=all

include=
include_file=

; applied after mode, in every mode
exclude=
exclude_file=

; 1 = also patch functions the plan marks short or interior (can corrupt the exe; for experiments only)
allow_unsafe=0

; abort = message box and exit on any loader error; continue = log it and run the original exe
on_error=abort

; 1 = log every patched address
verbose=0

; game clock speed (QueryPerformanceCounter, CRT clock, GetSystemTimeAsFileTime); works in every mode.
; The game caps one frame's delta at 0.1 s, so values above about 0.1 * fps gain nothing.
time_scale=1

; 1 = every hook goes through a stub that records the call (ring of the last 256, hit count per hook); on an
; access violation, illegal instruction, int3 or divide error a dump goes to the log and ff_hits.tsv is written
trace=0
; dumps per run (first-chance exceptions inside ntdll/kernelbase/kernel32 are skipped as probes)
max_dumps=4
; seconds between ff_hits.tsv rewrites (a killed game never reaches DLL_PROCESS_DETACH); 0 = only at crash and exit
hits_every=5
; exe function names for dumps and ff_hits.tsv (from hybrid/names.py)
names=ff_names.bin

; scripted input (see hybrid/scripts/skip_intro.txt): "at <s> key|down|up <DIK name>", "at <s> mouse <dx> <dy>",
; "at <s> click left|right|middle", "at <s> log <text>", "at <s> quit", "wait_scene <part of a Scenes\*.zip path>".
; Times: loader clock (real time x time_scale) since start or since the last satisfied wait_scene.
; The keyboard and mouse are forced to BACKGROUND|NONEXCLUSIVE so the game reads them without focus.
input_script=
; 0 = ignore the real keyboard and mouse while a script runs (injected input only)
input_real=1
; 1 = the game never sees its window lose focus, so it keeps running in the background (default: on with a script)
keep_active=
; log "scene:" lines for every new Scenes\*.zip the game opens (default: on with a script or trace)
log_scenes=

image=ff_ports.bin
plan=ff_hooks.bin
log=ff_hybrid.log
